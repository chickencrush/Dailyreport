<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a35"><title>Daily Report</title><link rel="icon" href="./icon-192.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><script src="./config.js"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101a35;color:#dce3f7;font:14px system-ui}a{color:#fff}#fallback{padding:24px;text-align:center}</style></head><body><div id="fallback" role="status" aria-live="polite">Menghubungkan…</div><script>
try{const url=new URL(window.DAILY_REPORT_URL);if(url.protocol!=='https:'||url.hostname!=='script.google.com')throw new Error();url.pathname=url.pathname.replace(/^\/macros\/u\/\d+\/s\//,'/macros/s/');if(!/^\/macros\/s\/[^/]+\/exec$/.test(url.pathname))throw new Error();url.search='';url.hash='';window.location.replace(url.href);setTimeout(()=>{const host=document.getElementById('fallback');host.textContent='';const link=document.createElement('a');link.href=url.href;link.textContent='Lanjut ke Daily Report';host.appendChild(link);},3000);}catch(error){document.getElementById('fallback').textContent='Alamat aplikasi belum valid. Periksa config.js.';}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
