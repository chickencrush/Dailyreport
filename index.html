<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a35"><title>Daily Report</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><script src="./config.js"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top right,#354176,#101a35 65%);font-family:system-ui,sans-serif;color:white;padding:24px}.card{width:min(100%,420px);padding:40px 28px;text-align:center;background:#ffffff09;border:1px solid #ffffff26;border-radius:28px;box-shadow:0 24px 80px #0003}img{width:112px;height:112px;border-radius:28px}h1{font-size:30px;margin:24px 0 8px}p{color:#c3cce1;line-height:1.6}a,button{display:block;width:100%;border:0;border-radius:14px;padding:16px;font:600 16px system-ui;cursor:pointer;text-decoration:none;margin-top:16px}a{background:#e00019;color:white}button{background:#ffffff14;color:white}#help{font-size:14px}a:focus-visible,button:focus-visible{outline:3px solid #ffe000;outline-offset:4px}</style></head>
<body><main class="card"><img src="./icon-192.png" alt="Logo Daily Report"><h1>Daily Report</h1><p>Chicken Crush</p><a id="open" target="_blank" rel="noopener noreferrer">Buka aplikasi</a><button id="install" type="button">Pasang di perangkat</button><p id="help" role="status" aria-live="polite">Laporan dibuka di browser dan memerlukan internet.</p></main><script>
const open=document.getElementById('open'),help=document.getElementById('help');
try{const url=new URL(window.DAILY_REPORT_URL);if(url.protocol!=='https:'||url.hostname!=='script.google.com'||!/^\/macros\/s\/[^/]+\/exec$/.test(url.pathname))throw new Error();open.href=url.href;}catch(error){open.removeAttribute('href');help.textContent='Alamat aplikasi belum valid. Periksa config.js.';}
let promptEvent=null;window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();promptEvent=event;});
document.getElementById('install').addEventListener('click',async()=>{if(promptEvent){const event=promptEvent;promptEvent=null;await event.prompt();await event.userChoice;}else{help.textContent=/iPad|iPhone|iPod/.test(navigator.userAgent)?'Di Safari, pilih Bagikan → Tambahkan ke Layar Utama.':'Buka menu browser lalu pilih Instal aplikasi atau Tambahkan ke layar utama.';}});
window.addEventListener('appinstalled',()=>{help.textContent='Daily Report sudah dipasang.';});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{help.textContent='Pemasangan belum tersedia. Anda tetap bisa membuka aplikasi.';});
</script></body></html>
